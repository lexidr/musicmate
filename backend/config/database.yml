default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgresql://localhost/musicmate_development") %>

test:
  <<: *default
  database: musicmate_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
